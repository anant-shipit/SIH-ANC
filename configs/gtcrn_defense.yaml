# Central configuration for GTCRN training and deployment on defense acoustic datasets
datasets:
  root_dir: "Datasets"
  voicebank:
    train_dir: "Datasets/VoiceBank/clean_trainset_28spk_wav"
    test_dir: "Datasets/VoiceBank/clean_testset_wav"
    val_speakers: ["p282", "p286", "p287"]
  esc50:
    root_dir: "Datasets/ESC50/ESC-50-master"
    audio_dir: "Datasets/ESC50/ESC-50-master/audio"
    meta_csv: "Datasets/ESC50/ESC-50-master/meta/esc50.csv"
    train_folds: [1, 2, 3]
    val_folds: [4]
    test_folds: [5]
    selected_classes:
      - "helicopter"
      - "airplane"
      - "siren"
      - "car_horn"
      - "engine"
      - "train"
      - "chainsaw"
      - "hand_saw"
      - "fireworks"
      - "crackling_fire"
      - "rain"
      - "thunderstorm"
      - "wind"
      - "sea_waves"
      - "water_drops"
      - "footsteps"
      - "breathing"
      - "coughing"
      - "clapping"
      - "laughing"
      - "sneezing"
      - "snoring"
      - "crying_baby"
  urbansound8k:
    root_dir: "Datasets/urbansound8k"
    meta_csv: "Datasets/urbansound8k/UrbanSound8K.csv"
    train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
    val_folds: [9]
    test_folds: [10]
    selected_classes:
      - "gun_shot"
      - "siren"
      - "engine_idling"
      - "jackhammer"
      - "drilling"
      - "car_horn"
  gunshot:
    root_dir: "Datasets/Gunshot_Audio_Dataset"
    train_weapons:
      - "AK-47"
      - "IMI Desert Eagle"
      - "M249"
      - "M4"
      - "MG-42"
      - "MP5"
      - "AK-12"
    val_weapons:
      - "M16"
    unseen_test_weapons:
      - "Zastava M92"
  edge_guns:
    root_dir: "Datasets/edge-collected-gunshot-audio (1)"
    audio_dir: "Datasets/edge-collected-gunshot-audio (1)/edge-collected-gunshot-audio"
    meta_csv: "Datasets/edge-collected-gunshot-audio (1)/gunshot-audio-all-metadata.csv"
    train_sessions: ["1", "2", "3"]
    val_sessions: ["4"]
    test_sessions: ["5"]
  demand:
    # Optional future dataset; null if not available
    root_dir: null
    environments:
      - "NFIELD"
      - "NPARK"
      - "NRIVER"
      - "STRAFFIC"
      - "PSTATION"
      - "SPSQUARE"
      - "TBUS"
      - "TCAR"
      - "TMETRO"

audio:
  sample_rate: 16000
  channels: 1
  nfft: 512
  hop_length: 256
  crop_samples: 32000
  crop_duration_s: 2.0

mixing:
  # Signal mixing ratio: 40% clean speech, 60% background/noise
  clean_ratio: 0.40
  background_ratio: 0.60
  snr_db: [-10.0, -5.0, 0.0, 5.0, 10.0, 15.0]
  optional_snr_db: [-15.0]
  # Probabilities for the 6 defense sample mixture types (emphasizing background noise at 60%)
  probabilities:
    type_a_clean_background: 0.60
    type_b_clean_environmental: 0.05
    type_c_clean_gunfire: 0.05
    type_d_clean_background_gunfire: 0.15
    type_e_clean_background_environmental: 0.10
    type_f_clean_background_multiple_events: 0.05
  gunfire_events:
    single_shot_prob: 0.40
    multiple_shots_prob: 0.35
    burst_prob: 0.25
    min_shots: 2
    max_shots: 4
    burst_interval_ms: [50, 120]

# ── GTCRN Model ──
model:
  name: "GTCRN"
  params: "23.67K"
  mmacs: "33.0"

# ── Loss ──
loss:
  # Primary: Hybrid loss (compressed spectral + SI-SNR)
  type: "hybrid"
  compression_power: 0.3
  lambda_ri: 30.0
  lambda_mag: 70.0
  # Secondary: Multi-resolution STFT loss
  multi_resolution:
    enabled: true
    weight: 0.1
    fft_sizes: [512, 1024, 2048]
  # Loss warmup: spectral-only for N epochs before adding SI-SNR
  warmup_epochs: 3

# ── Optimized Training Configuration ──
training:
  # Optimizer
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.999]

  # Scheduler
  scheduler: "cosine_warm_restarts"
  warmup_epochs: 3
  T_0: 10
  T_mult: 2
  eta_min_factor: 0.01

  # Training loop
  epochs: 60
  batch_size: 16
  grad_accum_steps: 1
  grad_clip: 3.0
  n_pairs: 10000
  num_workers: 4
  seed: 42
  device: "auto"

  # EMA (Exponential Moving Average)
  ema_decay: 0.999

  # Early stopping
  patience: 15
  top_k_checkpoints: 3

  # SpecAugment
  spec_augment:
    enabled: true
    freq_mask_param: 15
    time_mask_param: 20
    n_freq_masks: 2
    n_time_masks: 2

  # SNR curriculum (easy → hard)
  snr_curriculum:
    enabled: true
    start_range: [5.0, 15.0]
    end_range: [-10.0, 15.0]
    ramp_epochs: 10

  # Checkpoints
  checkpoint_init: "models/gtcrn/checkpoints/model_trained_on_dns3.tar"
  save_dir: "models/checkpoints"

export:
  onnx_stream: "models/gtcrn_finetuned_stream.onnx"
  onnx_int8: "models/gtcrn_finetuned_stream_int8.onnx"
  opset_version: 14
